
services:
  tarcms-db:
    image: mysql:8.0
    container_name: tarcms-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tarcms_db}
      MYSQL_USER: ${MYSQL_USER:-tarc_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tarc_password}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  tarcms-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: tarcms-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-mysql://tarc_admin:tarc_password@tarcms-db:3306/tarcms_db}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-https://tarc.gov.et}
    depends_on:
      tarcms-db:
        condition: service_healthy
    volumes:
      - uploads_prod_data:/app/apps/server/uploads

  tarcms-public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
    container_name: tarcms-prod-public
    restart: always
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - tarcms-server

  tarcms-dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: tarcms-prod-dashboard
    restart: always
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - tarcms-server

volumes:
  mysql_prod_data:
  uploads_prod_data:
